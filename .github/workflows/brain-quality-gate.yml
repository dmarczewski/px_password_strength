name: BRAIN quality gate (syntax)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: code-syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No PHP files found" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find ./js -type f -name '*.js' -print0)
          if (( ${#files[@]} == 0 )); then
            echo "No JavaScript files found in js/" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            node --check "$file"
            echo "OK: $file"
          done
